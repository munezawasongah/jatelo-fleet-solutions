name: jatelo-fleet

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: jfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jfs
      POSTGRES_PASSWORD: jfs_local_dev
      POSTGRES_DB: jatelo_fleet
    ports:
      - '5433:5432'
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=100
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jfs -d jatelo_fleet']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: jfs-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local development (production uses Cloudflare R2).
  storage:
    image: rustfs/rustfs:latest
    container_name: jfs-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: jfs_storage
      RUSTFS_SECRET_KEY: jfs_storage_local_dev
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD', 'sh', '-c', 'curl -sf http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  storagedata:
